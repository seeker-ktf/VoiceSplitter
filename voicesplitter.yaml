# Input/Output
input_file: 'C:\audio\test file1.wav'
output_folder: 'C:\audio\test file1\'
output_format: "wav"          # wav, mp3, flac

# Audio region (optional — omit or leave blank to process entire file)
start_time:                   # HH:MM:SS or seconds
end_time:

# Speaker detection (if min and max are the same, forces exact count)
min_speakers: 2
max_speakers: 7

# Segment merging
merge_gap: 1.5                # seconds — merge same-speaker segments closer than this
min_clip_length: 1.0          # seconds — discard clips shorter than this

# Auth
hf_token: ""                  # or set HF_TOKEN env var
offline_mode: false            # true = skip HuggingFace server checks, use cached models only
